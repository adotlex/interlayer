[project]
name = "interlayer"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pydantic>=2.13.4,<3",
  "typer>=0.27.1,<0.28",
  "rich>=15.0.0,<16",
  "networkx>=3.6.1,<4",
  "python-igraph>=1.0.0,<2",
  "leidenalg>=0.12.0,<0.13",
  "rapidfuzz>=3.14.5,<4",
  "jinja2>=3.1.6,<4",
  "platformdirs>=4.11.3,<5",
  "orjson>=3.12.0,<4",
  "python-dateutil>=2.9.0,<3",
  "pyyaml>=6.0.3,<7",
]
[project.scripts]
interlayer = "interlayer.cli:app"

[project.optional-dependencies]
plotly = ["plotly>=6.9.0,<7"]
[dependency-groups]
dev = [
  "pytest>=9.1.1,<10", "pytest-cov>=7.1.0,<8", "pytest-xdist>=3.8.0,<4",
  "hypothesis>=6.165.10,<7", "syrupy>=5.5.3,<6", "freezegun>=1.5.5,<2",
  "ruff>=0.16.4,<0.17", "mypy>=2.3.1,<3",
  "types-python-dateutil>=2.9.0", "types-pyyaml>=6.0.12",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/interlayer"]
