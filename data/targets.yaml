# SHIPPED VERBATIM from docs/research/R5-targets-and-privacy.md
# "Proposed target registry" (doc lines 462-818), with exactly one mechanical change:
# the entity id `citadel_llc` is renamed `citadel` so it equals `core.models.Firm.CITADEL`,
# which is frozen for Wave 2. Nothing else — no alias, regex, threshold or vocabulary token —
# was edited. The `normalisation` block in particular must not be hand-edited: it is the
# vocabulary the measured 100/100 fixture result depends on.
#
# The only other addition is this comment block, reproducing R5's "Resolving the numeric
# company IDs locally" procedure at the point of use, because `company_id: null` is the one
# field a user is expected to fill in by hand:
#
#   Slugs are stable and authoritative; numeric IDs are the more robust join key but are not
#   publicly indexed, so every entity below ships `linkedin_company_id: null`. Resolve them
#   once, locally, while logged in:
#     1. Open https://www.linkedin.com/company/<slug>/
#     2. View source and search `urn:li:organization:` — the trailing digits are the ID.
#     3. Or: run a LinkedIn job search filtered to the company; the URL carries `f_C=<id>`.
#        (As of Aug 2026 LinkedIn's AI job search retains only f_TPR, f_C, f_AL, f_EA as URL
#        filters.)
#     4. Write the integer into this file. A non-null ID enables exact joins on any surface
#        that emits URNs.
#   LinkedIn's UI may have changed since 2026-08-17; treat the steps as a starting point.
#
# interlayer target registry
# schema_version is checked at load; bump on any breaking shape change.
schema_version: 1
generated: "2026-08-17"
source: "docs/research/R5-targets-and-privacy.md"

