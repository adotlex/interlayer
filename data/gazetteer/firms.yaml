# =============================================================================
# interlayer :: firm gazetteer
# =============================================================================
# Hand-curated entity list for resolving free-text LinkedIn EMPLOYER / SCHOOL
# strings to canonical firms. This file is the source of truth; fuzzy matching
# is only ever used to reach an alias in this file, never to invent a match.
#
# Matching contract (see docs/research/04-entity-resolution.md):
#   1. normalize(input) -> norm
#   2. if norm in exact_index  -> accept (score 100)
#   3. if any negative_alias of ANY entity matches norm exactly -> REJECT
#      (negative aliases are global vetoes, evaluated before fuzzy)
#   4. fuzzy match norm against alias_index; accept iff score >= threshold
#      AND the field-context guard passes.
#
# Field-context guard:
#   entity_type: university      -> only matchable from an EDUCATION field
#   entity_type: fund|market_maker -> only matchable from a POSITION field
#   A "The Citadel" string in EDUCATION is the college. The same string in a
#   POSITION field is *ambiguous*, not the college: emit citadel_ambiguous.
#
# schema_version bumps when field semantics change.
# =============================================================================
schema_version: 1
updated: 2026-08-21
notes: >
  Headcounts are order-of-magnitude figures for size-weighting only (rarity of a
  connection scales ~1/headcount). They are third-party estimates from 2024-2026
  and are NOT authoritative. LinkedIn slugs were gathered from public search
  result metadata; linkedin.com is egress-blocked from the research sandbox, so
  slugs marked `verified: false` should be re-checked against a live browser
  before being used as a hard key.

