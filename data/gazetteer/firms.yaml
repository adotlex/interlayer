# -----------------------------------------------------------------------------
# Global normalization config consumed by the matcher.
# -----------------------------------------------------------------------------
normalization:
  legal_suffixes:
    - inc
    - inc.
    - incorporated
    - llc
    - l.l.c.
    - llp
    - l.l.p.
    - lp
    - l.p.
    - ltd
    - ltd.
    - limited
    - plc
    - corp
    - corp.
    - corporation
    - co
    - co.
    - company
    - gmbh
    - ag
    - sa
    - s.a.
    - s.a.s
    - sas
    - nv
    - n.v.
    - bv
    - b.v.
    - ab
    - as
    - oy
    - aps
    - pte
    - pte.
    - pty
    - pvt
    - private limited
    - sarl
    - s.a.r.l.
    - srl
    - spa
    - s.p.a.
    - kk
    - k.k.
    - kft
    - zrt
    - sp z oo
    - oao
    - ooo
    - holdings
    - holding
    - group          # STRIP LAST ONLY - see docs; "Jane Street Group" -> "jane street"
  # DELIBERATELY ABSENT: "trust" and "partners".
  # Stripping them makes an unrelated firm an EXACT index hit, and exact hits skip
  # the containment guard entirely: "Citadel Trust" -> "citadel" and "Jane Street
  # Partners" -> "jane street" were both accepted at 100.0 as the target firms.
  # Symmetric stripping of query and alias does not help here -- the query is a
  # different company, not a variant spelling of the same one. Real aliases that
  # need these words ("Millennium Partners") are indexed under their full form.
  suffix_strip_mode: repeated_trailing   # strip repeatedly from the END only
  noise_tokens:                          # dropped anywhere in the string
    - the
  # NB: "the" is dropped for the *fuzzy index* but the RAW string is retained and
  # checked against negative_aliases first, because "The Citadel" vs "Citadel" is
  # exactly the distinction we must preserve. See docs section 1.
  keep_raw_for_negatives: true
  ampersand_to_and: true
  strip_diacritics: true
  unicode_form: NFKC
  casefold: true
  collapse_whitespace: true
  strip_punctuation: true
  strip_parentheticals: false            # "(A Citadel Company)" is signal, keep it

# -----------------------------------------------------------------------------
# Matching thresholds (empirically derived - see docs/research/04-entity-resolution.md)
# -----------------------------------------------------------------------------
# Empirically selected: rapidfuzz WRatio evaluated ALWAYS behind the containment
# guard and the negative gazetteer. Numbers from docs/research/04-entity-resolution.md
# (Experiment G): at 86-90 the hold-out recall plateaus at 0.692 with a 0.000
# wrong-firm rate; at 92 hold-out recall falls to 0.572 for no precision gain.
thresholds:
  exact: 100
  primary_scorer: WRatio
  require_containment_guard: true     # NON-OPTIONAL. The scorer alone is unsafe.
  guard_token_threshold: 80           # per-token alignment cutoff inside the guard
  accept: 90          # >= 90 -> auto-accept  (top of the 86-90 plateau)
  review_low: 84      # 84..89 -> human/LLM review queue
  reject: 84          # < 84 -> reject
  weak_alias_accept: 100      # weak aliases (JS, SIG, IMC, CS) need an EXACT hit
  weak_alias_requires_corroboration: true
  banned_scorers:
    # All of these score 100 for "Citadel" vs "Citadel Broadcasting" (see Exp. D)
    # and MUST NOT be used as a bare accept signal.
    - partial_ratio
    - partial_token_sort_ratio
    - partial_token_set_ratio
    - token_set_ratio_without_guard
    - token_ratio_without_guard
